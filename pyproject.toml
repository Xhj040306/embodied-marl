[project]
name = "embodied-marl"
version = "0.1.0"
description = "Multi-agent reinforcement learning for cooperative embodied tasks in MuJoCo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xhj040306" }]
dependencies = [
    "mujoco>=3.3",
    "gymnasium>=1.0",
    "numpy>=2.0",
    "imageio>=2.37",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embodied_marl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
