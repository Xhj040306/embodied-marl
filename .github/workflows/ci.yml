name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

      - name: Physics smoke test (headless, no rendering)
        run: uv run python scripts/rollout.py --no-render --steps 200

      - name: Tutorial 01 (also verifies CJK-font fallback on Linux)
        run: uv run python tutorials/01_rl_basics.py --episodes 500
